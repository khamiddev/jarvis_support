<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI - System Start</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 1. LOGIN EKRANI */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: background-color 0.3s ease;
        }

        #login-title {
            color: #00ffcc;
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-box {
            background: transparent;
            border: 2px solid #ff9900;
            color: #00ffcc;
            padding: 12px 20px;
            font-size: 18px;
            text-align: center;
            outline: none;
            width: 300px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        #password-input {
            display: none; /* Boshida faqat Ism chiqadi */
        }

        /* 2. KIRISH VIDEOSI */
        #kirishVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 500;
        }

        /* 3. ASOSIY JARVIS UI */
        #jarvis-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 100;
        }

        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- LOGIN QISMI -->
    <div id="login-screen">
        <div id="login-title">ENTER USERNAME</div>
        <input type="text" id="username-input" class="input-box" placeholder="Username..." autocomplete="off" autofocus>
        <input type="password" id="password-input" class="input-box" placeholder="Password..." autocomplete="off">
    </div>

    <!-- KIRISH VIDEOSI (kirish.mp4 - papkada bo'lishi kerak) -->
    <video id="kirishVideo" muted playsinline>
        <source src="kirish.mp4" type="video/mp4">
        Sizning brauzeringiz videoni qo'llab-quvvatlamaydi.
    </video>

    <!-- ASOSIY JARVIS INTERFEYSI -->
    <div id="jarvis-ui">
        <!-- ASOSIY FON VIDEOSI (main.mp4 - papkada bo'lishi kerak) -->
        <video id="mainVideo" muted playsinline>
            <source src="main.mp4" type="video/mp4">
        </video>
    </div>

    <!-- JavaScript faylini ulanishi -->
    <script src="script.js"></script>
</body>
</html>
